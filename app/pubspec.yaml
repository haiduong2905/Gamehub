name: game_hub
description: Game Hub - choi doi khang qua Wi-Fi/LAN, khong can Internet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  platform_core:
    path: ../packages/platform_core
  game_tictactoe:
    path: ../packages/game_tictactoe
  game_xiangqi:
    path: ../packages/game_xiangqi
  game_audio:
    path: ../packages/game_audio

  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  bonsoir: ^5.1.11
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.svg
    - assets/images/app_mark.svg
    - assets/images/paper_landscape.png
    - assets/images/title_banner.png
