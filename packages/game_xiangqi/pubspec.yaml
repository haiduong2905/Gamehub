name: game_xiangqi
description: Cờ tướng cho Game Hub.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  game_audio:
    path: ../game_audio
  platform_core:
    path: ../platform_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/sounds/move.mp3
    - assets/sounds/capture.mp3
    - assets/sounds/checkmate.wav
  fonts:
    - family: XiangqiBrush
      fonts:
        - asset: assets/fonts/XiangqiBrush-Regular.ttf
